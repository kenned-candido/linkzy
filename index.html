<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta -->
    <title>Your Name | Linkzy</title>
    <meta name="description" content="Your Name — Your bio. Find all my links in one place.">
    <link rel="icon" href="assets/images/mdi--link-variant.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourusername.github.io/linkzy/">
    <meta property="og:title" content="Your Name | Linkzy">
    <meta property="og:description" content="Your Name — Your bio. Find all my links in one place.">
    <meta property="og:image" content="https://yourusername.github.io/linkzy/assets/images/profile.png">
    <meta property="og:site_name" content="Linkzy">
    <meta property="og:locale" content="en_US">

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Your Name | Linkzy">
    <meta name="twitter:description" content="Your Name — Your bio. Find all my links in one place.">
    <meta name="twitter:image" content="https://yourusername.github.io/linkzy/assets/images/profile.png">

    <!-- Theme -->
    <meta name="theme-color" content="#1A1E22">
</head>
<body>

    <!-- Ambient background glows -->
    <div class="ambient-glow glow-1" aria-hidden="true"></div>
    <div class="ambient-glow glow-2" aria-hidden="true"></div>

    <div class="container">

        <!-- Profile Header -->
        <header>
            <!--
                Profile picture source is set by main.js.
                To change it, edit the variables at the top of assets/js/main.js:
                  - useGithubAvatar: true = pull from GitHub, false = use local file
                  - githubUsername: your GitHub username
                  - localImagePath: path to your local image
            -->
            <div class="avatar-wrapper">
                <img id="profile-picture" class="profile-picture" alt="Profile picture">
            </div>

            <h1 class="name">Your Name</h1>
            <p class="username">@yourusername</p>

            <!--
                Social icon links.
                Add or remove <a> tags as needed.
                Use inline SVG icons with fill="currentColor" so they follow the theme color.
                You can find free SVG icons at https://simpleicons.org or https://iconify.design
            -->
            <nav class="social-links" aria-label="Social media">
                <!-- Example:
                <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                        <title>GitHub</title>
                        <path d="..."/>
                    </svg>
                </a>
                -->
            </nav>
        </header>

        <!-- Main link list -->
        <main>
            <!--
                Add your links below.
                Each link follows the pattern:
                <a href="YOUR_URL" class="link" target="_blank" rel="noopener noreferrer">LABEL</a>

                For email links, use:
                <a href="mailto:you@example.com" class="link">E-MAIL</a>
            -->
            <nav class="links" aria-label="Links">
                <a href="#" class="link" target="_blank" rel="noopener noreferrer">YOUR LINK</a>
            </nav>
        </main>

        <!-- Footer -->
        <footer class="footer-links">
            <a href="https://github.com/kenned-candido/Linkzy" target="_blank" rel="noopener noreferrer">GitHub</a>
            <span aria-hidden="true">•</span>
            <a href="https://github.com/kenned-candido/Linkzy/issues" target="_blank" rel="noopener noreferrer">Report Bug</a>
            <span aria-hidden="true">•</span>
            <!-- Opens the donate modal (controlled by main.js) -->
            <a href="#donate-modal" id="donate-btn">Donate</a>
        </footer>

    </div><!-- /.container -->

    <!--
        Donate Modal.
        This modal supports the original Linkzy project.
        Please consider keeping it — it helps the project stay alive. :)
        Controlled by assets/js/main.js.
    -->
    <div id="donate-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="donate-title">
        <div class="modal-content">
            <button class="close" aria-label="Close donation modal">&times;</button>
            <h2 id="donate-title">SUPPORT LINKZY</h2>
            <p>Choose a way to support:</p>
            <div class="donate-options">
                <a href="https://github.com/sponsors/kenned-candido" target="_blank" rel="noopener noreferrer" class="donate-link">GitHub Sponsors</a>
                <a href="https://www.paypal.com/donate/?business=AUZRQZ6DZZAPQ&no_recurring=0&currency_code=USD" target="_blank" rel="noopener noreferrer" class="donate-link">PayPal</a>
                <div class="pix-box">
                    <p><strong>PIX:</strong></p>
                    <img src="assets/images/pix-qrcode.png" alt="PIX QR Code" class="pix-qr">
                    <p class="pix-key">a3eedbcc-64a3-4a26-94bd-e0b1041a817a</p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
